<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Privat</title>
<style>
  :root {
    --ground:#F4F5F1; --surface:#FFFFFF; --ink:#1B241F; --ink-2:#4A554D; --ink-3:#77827A;
    --rule:#DCE0D7; --accent:#7A2C46; --accent-ink:#6B2440; --shadow:0 6px 24px -14px rgba(27,36,31,.4);
    --body:Corbel,Candara,"Segoe UI",system-ui,sans-serif;
    --display:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --data:Consolas,"DejaVu Sans Mono",monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#131814; --surface:#1A201B; --ink:#ECEFE8; --ink-2:#B2BAB1; --ink-3:#7E887F;
      --rule:#2B322B; --accent:#E3A0B4; --accent-ink:#EDBDCB; --shadow:0 6px 24px -14px rgba(0,0,0,.8);
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--body); }

  /* ---- Sperrbildschirm ---- */
  #tor { min-height:100vh; display:grid; place-items:center; padding:24px; }
  #tor .box {
    background:var(--surface); border:1px solid var(--rule); border-left:3px solid var(--accent);
    border-radius:3px; padding:30px 32px; max-width:400px; width:100%;
    display:grid; gap:16px; box-shadow:var(--shadow);
  }
  #tor h1 { font-family:var(--display); font-weight:400; font-size:26px; margin:0; }
  #tor p { margin:0; font-size:14px; color:var(--ink-2); line-height:1.5; }
  #tor label { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
  #tor input {
    width:100%; padding:11px 13px; font-size:16px; font-family:var(--body);
    border:1px solid var(--rule); border-radius:3px; background:var(--ground); color:var(--ink);
  }
  #tor input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  #tor button {
    padding:11px 18px; font-size:15px; font-weight:600; font-family:var(--body);
    background:var(--accent); color:var(--ground); border:none; border-radius:3px; cursor:pointer;
  }
  #tor button:disabled { opacity:.55; cursor:progress; }
  #meldung { font-size:13.5px; color:var(--accent-ink); min-height:1.2em; }

  /* ---- Inhalt ---- */
  #inhalt { display:none; }
  #seitenwahl {
    position:sticky; top:0; z-index:60; background:var(--surface);
    border-bottom:1px solid var(--rule); padding:8px 16px;
    display:flex; gap:6px; align-items:center; flex-wrap:wrap;
  }
  #seitenwahl select {
    font-family:var(--body); font-size:14px; padding:5px 8px;
    border:1px solid var(--rule); border-radius:3px; background:var(--ground); color:var(--ink);
    max-width:60vw;
  }
  #seitenwahl .stand { font-family:var(--data); font-size:11.5px; color:var(--ink-3); margin-left:auto; }
  #seitenwahl button {
    font-family:var(--body); font-size:13px; padding:5px 10px; cursor:pointer;
    border:1px solid var(--rule); border-radius:3px; background:var(--ground); color:var(--ink-2);
  }
  #buehne > iframe { width:100%; border:0; display:block; }

  /* ---- Markdown-Ansicht ---- */
  .md { max-width:820px; margin:0 auto; padding:34px 24px 80px; line-height:1.6; font-size:16px; }
  .md h1,.md h2,.md h3 { font-family:var(--display); font-weight:400; line-height:1.2; margin:1.6em 0 .5em; }
  .md h1 { font-size:34px; margin-top:0; }
  .md h2 { font-size:25px; border-bottom:1px solid var(--rule); padding-bottom:.25em; }
  .md h3 { font-size:20px; }
  .md h4 { font-size:13px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin:1.6em 0 .4em; }
  .md p { margin:.7em 0; }
  .md ul,.md ol { margin:.7em 0; padding-left:22px; }
  .md li { margin:.3em 0; }
  .md a { color:var(--accent); }
  .md code { font-family:var(--data); font-size:.88em; background:var(--surface); padding:1px 5px; border-radius:3px; border:1px solid var(--rule); }
  .md hr { border:0; border-top:1px solid var(--rule); margin:2em 0; }
  .md em { color:var(--ink-2); }
  .md .tabelle { overflow-x:auto; margin:1em 0; }
  .md table { border-collapse:collapse; width:100%; font-size:14.5px; }
  .md th { text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); border-bottom:1px solid var(--ink-3); padding:0 12px 6px 0; white-space:nowrap; }
  .md td { padding:8px 12px 8px 0; border-bottom:1px solid var(--rule); vertical-align:top; }
  .md blockquote { margin:1em 0; padding:12px 16px; background:var(--surface); border-left:3px solid var(--rule); border-radius:0 3px 3px 0; }
  .md blockquote > :first-child { margin-top:0; }
  .md blockquote > :last-child { margin-bottom:0; }
  .md blockquote.hinweis { border-left-color:var(--ink-3); }
  .md blockquote.frage   { border-left-color:#8A6516; }
  .md blockquote.achtung { border-left-color:var(--accent); }
  .md blockquote.gut     { border-left-color:#2F6249; }
  .md .marke { display:block; font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:600; color:var(--ink-3); margin-bottom:5px; }
  .md .wikilink { color:var(--accent); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
  .md .kopfblock { font-family:var(--data); font-size:11.5px; color:var(--ink-3); border-bottom:1px solid var(--rule); padding-bottom:10px; margin-bottom:22px; white-space:pre-wrap; }
</style>
</head>
<body>

<div id="tor">
  <form class="box" id="formular">
    <h1>Wladimir &amp; Diana</h1>
    <p>Diese Seite ist verschlüsselt. Ohne das Passwort ist hier nichts zu lesen — auch nicht im Quelltext.</p>
    <label for="pw">Passwort</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus />
    <button type="submit" id="knopf">Öffnen</button>
    <div id="meldung" aria-live="polite"></div>
  </form>
</div>

<div id="inhalt">
  <div id="seitenwahl">
    <select id="auswahl" aria-label="Seite wählen"></select>
    <button type="button" id="sperren">Sperren</button>
    <span class="stand" id="standanzeige"></span>
  </div>
  <div id="buehne"></div>
</div>

<script>
(function () {
  "use strict";

  var tresor = JSON.parse(document.getElementById("tresor").textContent);
  var daten = null;

  function ausBase64(s) {
    var roh = atob(s), feld = new Uint8Array(roh.length);
    for (var i = 0; i < roh.length; i++) { feld[i] = roh.charCodeAt(i); }
    return feld;
  }

  async function entschluesseln(passwort) {
    var enc = new TextEncoder();
    var basis = await crypto.subtle.importKey("raw", enc.encode(passwort), "PBKDF2", false, ["deriveKey"]);
    var schluessel = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: ausBase64(tresor.salz), iterations: tresor.runden, hash: "SHA-256" },
      basis, { name: "AES-CBC", length: 256 }, false, ["decrypt"]
    );
    var klar = await crypto.subtle.decrypt(
      { name: "AES-CBC", iv: ausBase64(tresor.iv) }, schluessel, ausBase64(tresor.inhalt)
    );
    var text = new TextDecoder().decode(klar);
    if (text.indexOf(tresor.marke) !== 0) { throw new Error("falsch"); }
    return JSON.parse(text.slice(tresor.marke.length));
  }

  /* ---------- Markdown, klein gehalten ---------- */
  function schutz(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function zeileFormatieren(s) {
    return schutz(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '<span class="wikilink" data-ziel="$1">$2</span>')
      .replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink" data-ziel="$1">$1</span>')
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  }

  function tabelleBauen(zeilen) {
    var kopf = zeilen[0].split("|").slice(1, -1).map(function (z) { return zeileFormatieren(z.trim()); });
    var koerper = zeilen.slice(2).map(function (r) {
      return r.split("|").slice(1, -1).map(function (z) { return zeileFormatieren(z.trim()); });
    });
    var h = "<div class='tabelle'><table><thead><tr>" +
      kopf.map(function (z) { return "<th>" + z + "</th>"; }).join("") + "</tr></thead><tbody>";
    koerper.forEach(function (r) {
      h += "<tr>" + r.map(function (z) { return "<td>" + z + "</td>"; }).join("") + "</tr>";
    });
    return h + "</tbody></table></div>";
  }

  function markdown(text) {
    var zeilen = text.replace(/\r/g, "").split("\n");
    var aus = [], i = 0;

    /* Kopfblock: about/tags/quellen/stand am Dateianfang */
    var kopf = [];
    while (i < zeilen.length && /^(about|tags|quellen|stand):/.test(zeilen[i])) { kopf.push(zeilen[i]); i++; }
    if (kopf.length) { aus.push('<div class="kopfblock">' + schutz(kopf.join("\n")) + "</div>"); }

    var liste = null;

    function listeSchliessen() {
      if (liste) { aus.push("</" + liste + ">"); liste = null; }
    }

    for (; i < zeilen.length; i++) {
      var z = zeilen[i];

      if (/^\s*$/.test(z)) { listeSchliessen(); continue; }

      /* Tabelle */
      if (/^\|/.test(z) && i + 1 < zeilen.length && /^\|[\s:|-]+\|$/.test(zeilen[i + 1].trim())) {
        listeSchliessen();
        var block = [];
        while (i < zeilen.length && /^\|/.test(zeilen[i])) { block.push(zeilen[i]); i++; }
        i--;
        aus.push(tabelleBauen(block));
        continue;
      }

      /* Zitat und Hinweiskästen */
      if (/^>/.test(z)) {
        listeSchliessen();
        var zitat = [];
        while (i < zeilen.length && /^>/.test(zeilen[i])) { zitat.push(zeilen[i].replace(/^>\s?/, "")); i++; }
        i--;
        var art = "hinweis", marke = "";
        var erste = zitat[0] || "";
        var treffer = erste.match(/^\[!([a-zäöüß ]+)\]\s*(.*)$/i);
        if (treffer) {
          var w = treffer[1].toLowerCase();
          marke = treffer[2] || treffer[1];
          if (w.indexOf("offene") === 0 || w.indexOf("frage") === 0) { art = "frage"; }
          else if (w.indexOf("widerspruch") === 0 || w.indexOf("warnung") === 0 || w.indexOf("achtung") === 0) { art = "achtung"; }
          else if (w.indexOf("geklaert") === 0 || w.indexOf("geklärt") === 0 || w.indexOf("entscheidung") === 0) { art = "gut"; }
          zitat = zitat.slice(1);
        }
        aus.push('<blockquote class="' + art + '">' +
          (marke ? '<span class="marke">' + zeileFormatieren(marke) + "</span>" : "") +
          markdown(zitat.join("\n")) + "</blockquote>");
        continue;
      }

      /* Überschriften */
      var u = z.match(/^(#{1,4})\s+(.*)$/);
      if (u) {
        listeSchliessen();
        aus.push("<h" + u[1].length + ">" + zeileFormatieren(u[2]) + "</h" + u[1].length + ">");
        continue;
      }

      if (/^(---|\*\*\*)\s*$/.test(z)) { listeSchliessen(); aus.push("<hr />"); continue; }

      /* Listen */
      var ul = z.match(/^\s*[-*]\s+(.*)$/);
      if (ul) {
        if (liste !== "ul") { listeSchliessen(); aus.push("<ul>"); liste = "ul"; }
        aus.push("<li>" + zeileFormatieren(ul[1]) + "</li>");
        continue;
      }
      var ol = z.match(/^\s*\d+\.\s+(.*)$/);
      if (ol) {
        if (liste !== "ol") { listeSchliessen(); aus.push("<ol>"); liste = "ol"; }
        aus.push("<li>" + zeileFormatieren(ol[1]) + "</li>");
        continue;
      }

      listeSchliessen();
      aus.push("<p>" + zeileFormatieren(z) + "</p>");
    }
    listeSchliessen();
    return aus.join("\n");
  }

  /* ---------- Anzeige ---------- */
  var buehne = document.getElementById("buehne");
  var auswahl = document.getElementById("auswahl");

  function zeigen(name) {
    var eintrag = daten.seiten.filter(function (s) { return s.name === name; })[0];
    if (!eintrag) { return; }
    auswahl.value = name;
    try { location.hash = encodeURIComponent(name); } catch (e) {}

    if (eintrag.art === "html") {
      buehne.innerHTML = "";
      var rahmen = document.createElement("iframe");
      rahmen.setAttribute("title", eintrag.titel);
      rahmen.srcdoc = eintrag.inhalt;
      rahmen.style.height = "calc(100vh - 42px)";
      buehne.appendChild(rahmen);
    } else {
      buehne.innerHTML = '<div class="md">' + markdown(eintrag.inhalt) + "</div>";
      buehne.scrollIntoView({ block: "start" });
      window.scrollTo(0, 0);
    }
  }

  buehne.addEventListener("click", function (e) {
    var ziel = e.target.closest ? e.target.closest(".wikilink") : null;
    if (!ziel) { return; }
    var name = ziel.getAttribute("data-ziel");
    var da = daten.seiten.some(function (s) { return s.name === name; });
    if (da) { zeigen(name); }
    else { alert("Für „" + name + "“ gibt es noch keine Seite."); }
  });

  auswahl.addEventListener("change", function () { zeigen(auswahl.value); });

  document.getElementById("sperren").addEventListener("click", function () {
    location.reload();
  });

  /* ---------- Anmelden ---------- */
  var formular = document.getElementById("formular");
  var meldung = document.getElementById("meldung");
  var knopf = document.getElementById("knopf");

  /* Der Browser gibt die Entschlüsselung nur auf https frei.
     Wird die Datei direkt vom Rechner geöffnet, fehlt sie - dann darf
     hier nicht "Passwort stimmt nicht" stehen, das führt in die Irre. */
  if (!(window.crypto && window.crypto.subtle)) {
    meldung.innerHTML = "Diese Seite muss über <b>https</b> geöffnet werden.<br>" +
      "Direkt vom Rechner geöffnet gibt der Browser die Entschlüsselung nicht frei.";
    document.getElementById("pw").disabled = true;
    knopf.disabled = true;
  }

  formular.addEventListener("submit", async function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value;
    if (!pw) { return; }
    knopf.disabled = true;
    meldung.textContent = "Wird entschlüsselt …";
    try {
      daten = await entschluesseln(pw);
      meldung.textContent = "";
      document.getElementById("pw").value = "";
      document.getElementById("tor").style.display = "none";
      document.getElementById("inhalt").style.display = "block";
      document.getElementById("standanzeige").textContent = "Stand " + daten.stand;
      document.title = daten.titel;
      auswahl.innerHTML = "";
      daten.seiten.forEach(function (s) {
        var o = document.createElement("option");
        o.value = s.name;
        o.textContent = s.titel;
        auswahl.appendChild(o);
      });
      var start = decodeURIComponent((location.hash || "").slice(1));
      zeigen(daten.seiten.some(function (s) { return s.name === start; }) ? start : daten.seiten[0].name);
    } catch (err) {
      meldung.textContent = "Passwort stimmt nicht.";
      knopf.disabled = false;
      document.getElementById("pw").select();
    }
  });
})();
</script>
</body>
</html>
